    replacement: "Image.Resampling.HAMMING"
    has_deterministic_transform: true
    transform_name: hamming_to_resampling_hamming

  # Font method changes (removed in 10.0.0)
  - symbol: "FreeTypeFont.getsize"
    change_type: removed
    severity: high
    from_version: "9.2.0"
    to_version: "10.0.0"
    description: "FreeTypeFont.getsize() method removed, use getbbox() for dimensions"
    replacement: "font.getbbox(text) returns (left, top, right, bottom); width = right - left, height = bottom - top"
    has_deterministic_transform: false
    notes: "getbbox() returns a 4-tuple bounding box, not a 2-tuple size. Height calculation differs slightly."

  - symbol: "FreeTypeFont.getoffset"
    change_type: removed
    severity: medium
    from_version: "9.2.0"
    to_version: "10.0.0"
    description: "FreeTypeFont.getoffset() method removed, offset info available in getbbox()"
    replacement: "font.getbbox(text) returns (left, top, right, bottom); offset is (left, top)"
    has_deterministic_transform: false
    notes: "The offset values are now the left and top values from getbbox()"

  - symbol: "FreeTypeFont.getsize_multiline"
    change_type: removed
    severity: medium
    from_version: "9.2.0"
    to_version: "10.0.0"
    description: "FreeTypeFont.getsize_multiline() removed, use ImageDraw.multiline_textbbox()"
    replacement: "ImageDraw.Draw(im).multiline_textbbox((0, 0), text, font)"
    has_deterministic_transform: false
    notes: "Requires creating an ImageDraw object"

  # ImageDraw text method changes (removed in 10.0.0)
  - symbol: "ImageDraw.textsize"
    change_type: removed
    severity: high
    from_version: "9.2.0"
    to_version: "10.0.0"
    description: "ImageDraw.textsize() method removed, use textbbox() or textlength()"
    replacement: "draw.textbbox((0, 0), text, font) for bbox; draw.textlength(text, font) for width"
    has_deterministic_transform: false
    notes: "textbbox() returns 4-tuple (left, top, right, bottom), textlength() returns width only"

  - symbol: "ImageDraw.multiline_textsize"
    change_type: removed
    severity: medium
    from_version: "9.2.0"
    to_version: "10.0.0"
    description: "ImageDraw.multiline_textsize() removed, use multiline_textbbox()"
    replacement: "draw.multiline_textbbox((0, 0), text, font)"
    has_deterministic_transform: false
    notes: "Returns 4-tuple bounding box instead of 2-tuple size"

