# Pillow (PIL Fork) Knowledge Base
# Breaking changes from v8.x to v10.x

name: pillow
display_name: Pillow (PIL Fork)
description: Python Imaging Library fork for image processing and manipulation
migration_guide_url: https://pillow.readthedocs.io/en/stable/deprecations.html

supported_migrations:
  - from: "8.0"
    to: "10.0"
  - from: "9.0"
    to: "10.0"

breaking_changes:
  # Resampling filter constant changes (removed in 10.0.0)
  - symbol: "Image.ANTIALIAS"
    change_type: removed
    severity: high
    from_version: "9.1.0"
    to_version: "10.0.0"
    description: "Image.ANTIALIAS constant removed, replaced with Resampling enum"
    replacement: "Image.Resampling.LANCZOS"
    has_deterministic_transform: true
    transform_name: antialias_to_resampling_lanczos
    notes: "ANTIALIAS was an alias for LANCZOS since Pillow 2.7.0"

  - symbol: "Image.LINEAR"
    change_type: removed
    severity: high
    from_version: "9.1.0"
    to_version: "10.0.0"
    description: "Image.LINEAR constant removed, replaced with Resampling enum"
    replacement: "Image.Resampling.BILINEAR"
    has_deterministic_transform: true
    transform_name: linear_to_resampling_bilinear

  - symbol: "Image.CUBIC"
    change_type: removed
    severity: high
    from_version: "9.1.0"
    to_version: "10.0.0"
    description: "Image.CUBIC constant removed, replaced with Resampling enum"
    replacement: "Image.Resampling.BICUBIC"
    has_deterministic_transform: true
    transform_name: cubic_to_resampling_bicubic

  - symbol: "Image.BILINEAR"
    change_type: removed
    severity: high
    from_version: "9.1.0"
    to_version: "10.0.0"
    description: "Image.BILINEAR constant removed, replaced with Resampling enum"
    replacement: "Image.Resampling.BILINEAR"
    has_deterministic_transform: true
    transform_name: bilinear_to_resampling_bilinear

  - symbol: "Image.BICUBIC"
    change_type: removed
    severity: high
    from_version: "9.1.0"
    to_version: "10.0.0"
    description: "Image.BICUBIC constant removed, replaced with Resampling enum"
    replacement: "Image.Resampling.BICUBIC"
    has_deterministic_transform: true
    transform_name: bicubic_to_resampling_bicubic

  - symbol: "Image.LANCZOS"
    change_type: removed
    severity: high
    from_version: "9.1.0"
    to_version: "10.0.0"
    description: "Image.LANCZOS constant removed, replaced with Resampling enum"
    replacement: "Image.Resampling.LANCZOS"
    has_deterministic_transform: true
    transform_name: lanczos_to_resampling_lanczos

  - symbol: "Image.NEAREST"
    change_type: removed
    severity: high
    from_version: "9.1.0"
    to_version: "10.0.0"
