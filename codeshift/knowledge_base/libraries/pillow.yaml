    replacement: "Image.Resampling.NEAREST"
    has_deterministic_transform: true
    transform_name: nearest_to_resampling_nearest

  - symbol: "Image.BOX"
    change_type: removed
    severity: medium
    from_version: "9.1.0"
    to_version: "10.0.0"
    description: "Image.BOX constant removed, replaced with Resampling enum"
    replacement: "Image.Resampling.BOX"
    has_deterministic_transform: true
    transform_name: box_to_resampling_box

  - symbol: "Image.HAMMING"
    change_type: removed
